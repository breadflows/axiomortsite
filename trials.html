<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rift Trials — AXIOMORT</title><meta name="theme-color" content="#0d1d25"><link rel="icon" href="cinematic/favicon.svg"><link rel="stylesheet" href="trials/style.css"><script type="importmap">{"imports":{"three":"./runtime/three.webgpu.js","three/webgpu":"./runtime/three.webgpu.js","three/tsl":"./runtime/three.tsl.js","three/addons/":"./runtime/addons/"}}</script></head><body>
